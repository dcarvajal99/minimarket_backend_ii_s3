spring.application.name=minimarket

# Configuracion de H2 en memoria
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# Configuracion de JPA e Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Configuracion de seguridad JWT
# La clave debe tener al menos 256 bits (32 caracteres) para el algoritmo HS256.
# En produccion debe externalizarse como variable de entorno, no versionarse.
jwt.secret=MiniMarketPlus2025ClaveSecretaJWTSuperSeguraParaFirmarTokensHS256
# Tiempo de expiracion del token en milisegundos (3600000 ms = 1 hora)
jwt.expiration=3600000
